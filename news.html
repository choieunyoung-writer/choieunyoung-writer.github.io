<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css?v=34">

</head>
<body class="page-news">
<p class="draft">시안입니다. 아래 내용은 작가님 확인 전 자리표시이며 실제 정보가 아닙니다.</p>
<header class="sitehead">
  <a class="brand" href="index.html">최은영</a>
  <nav class="menu" aria-label="주 메뉴"><a href="works.html">작품</a><a href="news.html" aria-current="page">소식</a><a href="about.html">소개</a><a href="contact.html">연락</a></nav>
  <div class="lang" aria-label="언어"><a href="news.html" aria-current="true" lang="ko">한국어</a><span aria-hidden="true">·</span><a href="en/news.html" lang="en" hreflang="en">EN</a></div>
</header>
<main class="panel">
  <section class="wrap">
    <h2 class="reveal">일정</h2>
    <!-- 공유 구글 캘린더(고운대표 2026-10-16): 캘린더에 일정을 적으면 여기 자동으로 뜬다.
         캘린더 ID를 data-cal에 넣으면 된다(예: abc123@group.calendar.google.com). 비어 있으면 자리표시만 보인다. -->
    <div class="cal reveal" data-cal="" data-tz="Asia/Seoul">
      <p class="cal-empty">[강연·낭독·행사 일정 — 공유 캘린더 연결 후 자동 표시]</p>
    </div>
  </section>
  <section class="wrap">
    <div class="news reveal">
      <div><h3>인터뷰</h3><ul class="newslist"><li><span class="date">[날짜]</span>[매체 · 제목 링크]</li></ul></div>
      <div><h3>리뷰</h3><ul class="newslist"><li><span class="date">[날짜]</span>[매체 · 제목 링크]</li></ul></div>
    </div>
  </section>
</main>
<footer><nav class="footnav"><a href="works.html">작품</a><a href="news.html">소식</a><a href="about.html">소개</a><a href="contact.html">연락</a></nav>© 최은영</footer>
<script>
// 스크롤하면 은은하게 나타나기. 움직임을 꺼 둔 사용자에겐 CSS에서 바로 보이게 처리.
(function(){
  var els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}})},{rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(e){io.observe(e)});
})();
</script>
<script>
// 공유 구글 캘린더 붙이기: data-cal에 캘린더 ID가 있으면 일정 목록(agenda)으로 보여 준다
(function(){
  var box=document.querySelector('.cal'); if(!box) return;
  var id=(box.dataset.cal||'').trim(); if(!id) return;
  var tz=box.dataset.tz||'Asia/Seoul', en=document.documentElement.lang==='en';
  var q='src='+encodeURIComponent(id)+'&ctz='+encodeURIComponent(tz)+'&mode=AGENDA&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0&showNav=1&wkst=1&bgcolor=%23ffffff&hl='+(en?'en':'ko');
  box.innerHTML='<iframe title="'+(en?'Events calendar':'일정 캘린더')+'" src="https://calendar.google.com/calendar/embed?'+q+'" loading="lazy"></iframe>'
    +'<p class="cal-sub"><a href="https://calendar.google.com/calendar/u/0?cid='+encodeURIComponent(btoa(id))+'" target="_blank" rel="noopener">'+(en?'Add to my Google Calendar ↗':'내 구글 캘린더에 추가 ↗')+'</a></p>';
})();
</script>
</body></html>
